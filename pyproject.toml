[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mekanik-hesap"
version = "0.1.0"
description = "Mekanik tesisat hesap kutuphanesi: TTT/HBK/ML/kesif hesap motoru"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mekanik_hesap*"]
